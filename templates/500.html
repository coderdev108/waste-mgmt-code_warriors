{% extends "base.html" %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center fade-in" style="max-width:600px">
  <div style="font-size:5rem">⚠️ 500</div>
  <h2 class="fw-700 mt-2 text-dark">Server Error</h2>
  <p class="text-muted mt-2">Something went wrong on our end. Please try again later.</p>
  <div class="mt-4">
    <a href="{% url 'role_redirect' %}" class="btn btn-eco btn-lg px-4">
      <i class="bi bi-arrow-clockwise me-2"></i>Reload
    </a>
  </div>
</div>
{% endblock %}
